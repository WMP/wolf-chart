{{- if .Values.filebrowser.enabled }}
# Simple HTTP file manager for uploading saves and mods.
# /srv/homes      = per-launcher homes (saves, prefixes)
# /srv/installers = shared RWX volume (mods, ripped discs)
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ printf "%s-filebrowser" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: filebrowser
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "common.labels.matchLabels" (dict "customLabels" .Values.commonLabels "context" $) | nindent 6 }}
      app.kubernetes.io/component: filebrowser
  template:
    metadata:
      labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: filebrowser
    spec:
      # homes are node-local hostPaths - browse them where they live
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {{- include "wolf.serverMatchLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: {{ .Values.session.uid }}
        runAsGroup: {{ .Values.session.gid }}
        fsGroup: {{ .Values.session.gid }}
        # With the default (Always) kubelet chowns EVERY file of the installers
        # PVC on each pod start - on a multi-hundred-GB RWX/NFS share that keeps
        # the pod in ContainerCreating for many minutes. OnRootMismatch only
        # walks it when the volume root does not already have the right group.
        fsGroupChangePolicy: {{ .Values.filebrowser.fsGroupChangePolicy }}
      containers:
        - name: filebrowser
          image: {{ include "wolf.filebrowser.image" . }}
          imagePullPolicy: {{ .Values.filebrowser.image.pullPolicy }}
          args: ["--noauth", "-r", "/srv", "-p", {{ .Values.filebrowser.service.port | quote }}, "-a", "0.0.0.0", "-d", "/tmp/fb.db"]
          ports:
            - containerPort: {{ .Values.filebrowser.service.port }}
          {{- if .Values.filebrowser.resources }}
          resources: {{- toYaml .Values.filebrowser.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: homes
              mountPath: /srv/homes
            {{- if or .Values.storage.installers.enabled .Values.storage.installers.existingClaim }}
            - name: installers
              mountPath: /srv/installers
            {{- end }}
            {{- if .Values.filebrowser.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.filebrowser.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
      volumes:
        - name: homes
          hostPath:
            path: {{ include "wolf.paths.homes" . }}
            type: DirectoryOrCreate
        {{- if or .Values.storage.installers.enabled .Values.storage.installers.existingClaim }}
        - name: installers
          persistentVolumeClaim:
            claimName: {{ .Values.storage.installers.existingClaim | default (printf "%s-installers" (include "common.names.fullname" .)) }}
        {{- end }}
        {{- if .Values.filebrowser.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.filebrowser.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
{{- end }}
