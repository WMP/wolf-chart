# Simple HTTP file manager for uploading saves and mods.
# /srv/heroic  = Heroic home (game prefixes: saves under drive_c/users/.../Documents, mods in the game dir)
# /srv/installers = shared RWX (mods, ripped discs)
# /srv/downloads = read-only installers (NFS)
apiVersion: apps/v1
kind: Deployment
metadata: {name: filebrowser, namespace: games}
spec:
  replicas: 1
  selector: {matchLabels: {app: filebrowser}}
  template:
    metadata: {labels: {app: filebrowser}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          args: ["--noauth", "-r", "/srv", "-p", "8080", "-a", "0.0.0.0", "-d", "/tmp/fb.db"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: heroic, mountPath: /srv/heroic}
            - {name: installers, mountPath: /srv/installers}
            - {name: downloads, mountPath: /srv/downloads, readOnly: true}
      volumes:
        - {name: heroic, hostPath: {path: /var/mnt/steam/gow-heroic-home, type: DirectoryOrCreate}}
        - {name: installers, persistentVolumeClaim: {claimName: installers}}
        - {name: downloads, nfs: {server: NFS_SERVER, path: /export/downloads, readOnly: true}}
---
apiVersion: v1
kind: Service
metadata: {name: filebrowser, namespace: games}
spec:
  type: NodePort
  selector: {app: filebrowser}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30808}]
